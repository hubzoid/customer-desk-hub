name: customer-desk
on:
  push:
  pull_request:
  schedule:
    - cron: "53 3 * * *"        # nightly against the pinned SDK in requirements-sdk.txt
permissions:
  contents: read
jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the pinned SDK and the desk's library
        run: python -m pip install -r requirements-sdk.txt -r requirements.txt pytest
      - name: Use this interpreter for ./desk
        run: echo "DESK_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
      - name: "Tests (requests, helpdesks, policy, safety and the workflow engine; real-model runs excluded)"
        run: python -m pytest -m "not real_model" --junitxml=output/tests.xml
      - name: Evals parse
        run: hubzoid eval list .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit
          path: output/*.xml
